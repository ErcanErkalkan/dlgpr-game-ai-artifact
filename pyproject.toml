[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlgpr-game-ai"
version = "0.6.0"
description = "Charged-time compute-budgeted GA-PSO-RL scheduler for game AI validation experiments"
requires-python = ">=3.9"
dependencies = ["numpy==2.4.3", "pandas==3.0.1", "matplotlib==3.10.8", "scipy==1.17.1", "gymnasium==1.3.0", "minigrid==3.1.0"]

[tool.setuptools]
package-dir = {"" = "code_package"}

[tool.setuptools.packages.find]
where = ["code_package"]
include = ["dlgpr*"]
